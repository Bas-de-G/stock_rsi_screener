name: Screener run

# Runs the screener on GitHub's servers hourly through the trading day,
# commits the collected history back to the repo, and publishes the dashboards
# to GitHub Pages — so there's a live URL that stays current with nobody's
# laptop switched on.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch. On a feature branch this file only runs via "Run workflow"; merge it
# to main for the schedule to start firing.
#
# Morningstar scraping is skipped by default: fair value is subscriber-only,
# and a session cookie is a credential. Record fair values by hand in
# fair_values.yaml instead — that file is committed, so it can be edited
# straight from github.com and the next run picks it up.

on:
  schedule:
    # Hourly on weekdays, 13:00–21:00 UTC. That window covers the US session
    # (13:30–20:00 UTC) plus the European afternoon, and the 21:00 run lands
    # after the US close so the daily bar it records is the settled one.
    #
    # Hourly rather than daily because the 1h and 4h horizons need it: a
    # once-a-day sample of an hourly RSI is up to 24 hours stale, which makes
    # the intraday pages decorative. The cost is ~9 data commits a weekday
    # instead of 1.
    - cron: "0 13-21 * * 1-5"
  workflow_dispatch:
  push:
    # Re-publish immediately when a fair value is edited on github.com.
    # Restricted to the default branch: without this the job runs on every
    # feature branch too, committing a generated SQLite file into whatever
    # pull request happens to be open.
    branches: [main]
    paths:
      - "fair_values.yaml"
      - "config.yaml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cheap to call every run: `backfill` skips any ticker that already has
      # a full chart's worth of history, so this only ever does real work for
      # a ticker newly added to config.yaml. That's what lets a new ticker
      # (SanDisk, say) pick up its own history automatically instead of
      # trickling in one live row a day for months.
      - name: Backfill any tickers missing history
        # No --range: each horizon has its own depth (5y weekly, 730d hourly).
        run: python -m screener.cli backfill

      - name: Run screener
        run: python -m screener.cli run

      # Writes index.html (1d) plus 1h.html, 4h.html and 1w.html alongside it.
      - name: Build dashboards
        run: python -m screener.cli dashboard --output site/index.html

      # Collected data belongs on the default branch only. Guarded rather
      # than assumed, so a manual `workflow_dispatch` from a feature branch
      # can't push generated files into an open pull request either.
      # data/screener.db is a binary blob, and SQLite deltas badly in git --
      # measured at ~57% of raw size per revision, because writes shuffle
      # pages throughout the file. At 9 scheduled runs a weekday that is
      # ~0.8 GB a month, or 9 GB a year; GitHub warns at 1 GB.
      #
      # So only the last run of the day snapshots it. The intermediate runs
      # still publish a fully fresh dashboard -- they just don't write the
      # database back. Nothing is lost by that: `backfill` reconstructs every
      # horizon's bars from Yahoo at the start of each run, and the patterns
      # are re-derived from those deterministically.
      #
      # Manual dispatches and config pushes always commit, so you can force a
      # snapshot whenever you want one.
      - name: Commit collected data
        if: github.ref_name == github.event.repository.default_branch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" != "21" ]; then
            echo "Intraday run — dashboard published; database snapshot deferred to 21:00 UTC."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ is gitignored so local runs stay clean; CI force-adds it
          # because this is where the shared history lives.
          git add -f data/screener.db data/latest.csv data/signals.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "data: screener run $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have pushed while this one was working.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push
          fi

      # enablement: true turns Pages on via the API, so this works without
      # anyone visiting Settings first. If the token isn't allowed to do that,
      # the publish steps are skipped rather than failing the whole run --
      # the data collection above has already succeeded and been committed.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
