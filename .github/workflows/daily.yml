name: Screener run

# Runs the screener on GitHub's servers hourly through the trading day,
# commits the collected history back to the repo, and publishes the dashboards
# to GitHub Pages — so there's a live URL that stays current with nobody's
# laptop switched on.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch. On a feature branch this file only runs via "Run workflow"; merge it
# to main for the schedule to start firing.
#
# Morningstar scraping is skipped by default: fair value is subscriber-only,
# and a session cookie is a credential. Record fair values by hand in
# fair_values.yaml instead — that file is committed, so it can be edited
# straight from github.com and the next run picks it up.

on:
  schedule:
    # Every 30 minutes on weekdays from the European open to the US close,
    # then a single run at 21:00.
    #
    # The window is 07:00–20:30 UTC because the watchlist is no longer
    # US-only. In August (summer time) the sessions are:
    #
    #   HKEX          01:30–08:00 UTC     2 tickers  (BYD, XIAOMI)
    #   Euronext/LSE  07:00–15:30 UTC    25 tickers  (AEX, Rolls-Royce, ...)
    #   US            13:30–20:00 UTC   103 tickers
    #
    # The old 13:00 start was written when every ticker was American. It
    # covered the US session fully but caught only the last 2.5 hours of the
    # European one and none of Asia, so 27 tickers were never sampled live
    # while they were actually trading. Their charts stayed complete either
    # way -- `backfill` reads the full session from Yahoo afterwards -- but
    # the live TradingView reading on the card was always a stale close.
    #
    # The 21:00 run lands after the US close so the daily bar it records is
    # the settled one.
    #
    # Sub-hourly rather than hourly because the 1h page is the one that goes
    # stale fastest. Note the 4h/1d/1w pages gain nothing from it: their bars
    # are keyed by date and simply get overwritten in place, so the extra runs
    # only sharpen the intraday view.
    #
    # Hour 21 deliberately has exactly ONE slot. The commit guard below defers
    # the database snapshot on any scheduled run outside hour 21, so a second
    # slot in that hour would commit the binary database twice a day instead
    # of once. The guard matches on the hour rather than the exact minute
    # because GitHub delays scheduled runs under load — a run that slips to
    # 21:07 must still commit, or the day's history is lost.
    #
    # GitHub's scheduler is best-effort on public repos: expect some of these
    # to arrive late or be skipped entirely under load. Minutes themselves are
    # free here (public repository), so the real costs are TradingView request
    # volume — 130 tickers x 4 horizons = 520 requests per run — and intraday
    # rows accumulating at twice the previous rate.
    # Two probes during the Hong Kong session. Only two tickers trade then, so
    # this is deliberately sparse rather than half-hourly.
    - cron: "0 3,6 * * 1-5"
    # European open through the US close.
    - cron: "0,30 7-20 * * 1-5"
    # After the US close. Exactly ONE slot in hour 21 -- see the commit guard.
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
  push:
    # Re-publish immediately when a fair value is edited on github.com.
    # Restricted to the default branch: without this the job runs on every
    # feature branch too, committing a generated SQLite file into whatever
    # pull request happens to be open.
    branches: [main]
    paths:
      - "fair_values.yaml"
      - "config.yaml"

permissions:
  contents: write
  pages: write
  id-token: write
  # Lets the publish step open an issue for a new strong buy. GitHub then
  # emails anyone watching the repository, which is a notification channel
  # that needs no credential stored anywhere -- see notify.send_github_issue.
  issues: write

concurrency:
  group: daily-screener
  # Let a new run evict a stuck one, rather than queueing behind it forever.
  #
  # With `false` the group admits one running plus one *pending* run, and any
  # further arrival cancels whichever run was pending. On 2026-08-06 a run
  # entered the `waiting` state at 17:46 and never left it, so it held the
  # group and every scheduled run after it queued, got evicted by the next
  # one, and never executed -- three in a row cancelled at exactly the moment
  # its successor arrived. The screener silently stopped publishing for
  # fourteen hours while every run still appeared to be "scheduled".
  #
  # `true` makes that self-healing: the next slot displaces the jam. Safe for
  # this workload because a run takes 3-4 minutes and the slots are 30 minutes
  # apart, so a cancellation only ever happens when something is genuinely
  # stuck -- and the work is idempotent, so the next run redoes it anyway.
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    # A healthy run is 3-4 minutes. This is a backstop so a hung step dies on
    # its own instead of occupying the concurrency group; it does not cover a
    # run stuck in `waiting` before the job starts -- cancel-in-progress does.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cheap to call every run: `backfill` skips any ticker that already has
      # a full chart's worth of history, so this only ever does real work for
      # a ticker newly added to config.yaml. That's what lets a new ticker
      # (SanDisk, say) pick up its own history automatically instead of
      # trickling in one live row a day for months.
      - name: Backfill any tickers missing history
        # No --range: each horizon has its own depth (5y weekly, 730d hourly).
        #
        # --max-new caps how many never-seen tickers get seeded in one run.
        # Yahoo is one request per ticker per horizon and cannot be batched the
        # way TradingView's RSI can, so adding a hundred names at once is 400
        # requests; at 25 a run they arrive over four runs instead of timing
        # one out. Everything already seeded is untouched by the cap.
        run: python -m screener.cli backfill --max-new 25

      - name: Run screener
        run: python -m screener.cli run

      # Measures what happened after every pattern on record, from price
      # history already on disk. Cheap (a few seconds) and idempotent, so it
      # runs unconditionally: the track-record page is built from its output,
      # and a stale one is worse than none.
      - name: Measure past signals
        run: python -m screener.cli evaluate

      # Writes index.html (1d) plus 1h.html, 4h.html and 1w.html alongside it.
      # SCREENER_WEBHOOK_URL is optional: unset, `send_webhook` returns False
      # and the deal is only printed. Note an Actions secret on a public repo
      # is readable by anyone who can push a workflow, so put a Slack or
      # Discord incoming-webhook URL here and nothing else -- the worst a leak
      # buys is the ability to post into that one channel.
      - name: Build dashboards
        run: python -m screener.cli dashboard --output site/index.html
        env:
          SCREENER_WEBHOOK_URL: ${{ secrets.SCREENER_WEBHOOK_URL }}
          # The ntfy topic everyone's phone subscribes to. Same caveat as the
          # webhook above -- on a public repo this is readable by anyone who
          # can push a workflow, and with ntfy the topic name is the only
          # access control there is. Worst case is a stranger reading which
          # stocks the screener likes; rotate by changing it here and
          # re-subscribing in the app.
          SCREENER_NTFY_TOPIC: ${{ secrets.SCREENER_NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Collected data belongs on the default branch only. Guarded rather
      # than assumed, so a manual `workflow_dispatch` from a feature branch
      # can't push generated files into an open pull request either.
      # data/screener.db is a binary blob, and SQLite deltas badly in git --
      # measured at ~57% of raw size per revision, because writes shuffle
      # pages throughout the file. Committing on every run would be ~0.8 GB a
      # month at the cron's nominal rate, or 9 GB a year; GitHub warns at 1 GB.
      #
      # (In practice GitHub delivers this repo roughly ONE scheduled run a day
      # regardless of what the cron asks for -- see the schedule comment at the
      # top. The guard still matters for the days it is generous, and for
      # dispatch- and push-triggered runs, which always commit.)
      #
      # So only the last run of the day snapshots it. The intermediate runs
      # still publish a fully fresh dashboard -- they just don't write the
      # database back. Nothing is lost by that: `backfill` reconstructs every
      # horizon's bars from Yahoo at the start of each run, and the patterns
      # are re-derived from those deterministically.
      #
      # Manual dispatches and config pushes always commit, so you can force a
      # snapshot whenever you want one.
      - name: Commit collected data
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Both of these are committed on EVERY run, deferral or not.
          #
          # notifications.json records which strong buys have already been
          # emailed, and is useless unless the next run half an hour later can
          # read it back -- which is exactly what deferring it broke: the same
          # signal was announced four or five times over an afternoon.
          #
          # recommendations.csv is the append-only record of what the screener
          # said and when. Same reasoning, higher stakes: a row that never gets
          # committed is a day of evidence gone, and it cannot be reconstructed
          # afterwards because the verdict depended on what was known then.
          #
          # Both are small and text, so they cost nothing to write every time.
          git add notifications.json recommendations.csv 2>/dev/null || true

          # Late-day runs snapshot the database; earlier ones defer.
          # Deliberately ">= 21" rather than "== 21": GitHub delivers this
          # repo's scheduled runs around 22:30, so matching the hour exactly
          # meant the one run that actually lands each day fell through and
          # never committed. 10# forces base 10, or `date +%H` returning "09"
          # is read as invalid octal.
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ "$((10#$(date -u +%H)))" -lt 21 ]; then
            echo "Intraday run — dashboard published; database snapshot deferred to the last run of the day."
          else
            # data/ is gitignored so local runs stay clean; CI force-adds it
            # because this is where the shared history lives.
            git add -f data/screener.db data/latest.csv data/signals.csv 2>/dev/null || true
          fi

          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "data: screener run $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another run may have pushed while this one was working.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push
          fi

      # enablement: true turns Pages on via the API, so this works without
      # anyone visiting Settings first. If the token isn't allowed to do that,
      # the publish steps are skipped rather than failing the whole run --
      # the data collection above has already succeeded and been committed.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: site

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
