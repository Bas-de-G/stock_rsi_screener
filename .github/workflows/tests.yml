name: Tests

# The screener's own test suite. Runs on every push and pull request.
#
# Deliberately separate from the daily run: these tests are fully offline —
# no network, no browser, no credentials — so they're fast and can't go red
# because TradingView had a blip or a scraped page changed shape.

on:
  # Only main here. Without the branch filter, a push to a branch that has an
  # open pull request triggers this twice — once for the push, once for the
  # pull_request event — burning double the minutes for the same commit.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the README claims; 3.11 is what the daily job uses.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check config.yaml is loadable
        run: |
          python -c "
          from screener.config import load_config, MARKETS
          c = load_config()
          print(f'{len(c.tickers)} tickers, rule={c.signal.valuation_rule}')
          syms = [t.symbol for t in c.tickers]
          dupes = {s for s in syms if syms.count(s) > 1}
          assert not dupes, f'duplicate symbols: {dupes}'
          untagged = [t.symbol for t in c.tickers if not t.markets]
          assert not untagged, f'tickers with no market tag: {untagged}'
          for m in MARKETS:
              print(f'  {m}: {len(c.tickers_in(m))}')
          for h in c.horizons:
              print(f'  {h.key}: window {h.window_days}d, margin {h.margin_pct}, {h.leverage}x')
          "

      - name: Check every dashboard page builds from an empty database
        run: |
          python -c "
          from pathlib import Path
          from screener.config import load_config
          from screener.storage import Store
          from screener.dashboard import build_all_dashboards
          c = load_config()
          with Store(Path('/tmp/ci.db')) as s:
              outs = build_all_dashboards(s, c, Path('/tmp/ci/index.html'))
          assert len(outs) == len(c.horizons) + 1, 'one page per horizon, plus the track record'
          assert any(o.name == 'index.html' for o in outs), 'default horizon must be index.html'
          assert any(o.name == 'history.html' for o in outs), 'track record must be built too'
          for o in outs:
              assert o.stat().st_size > 0, f'{o.name} came out empty'
              assert '<script' not in o.read_text().lower(), f'{o.name} grew a script tag'
              print(f'  {o.name}: {o.stat().st_size} bytes')
          "
