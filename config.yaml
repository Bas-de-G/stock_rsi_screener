  # --- Screened for strong-buy potential --------------------------------
  # Picked by measurement rather than taste. Every name below cleared two
  # tests over a year of daily bars: at least two completed double-crosses of
  # RSI 30, and earnings growing rather than shrinking. The second matters as
  # much as the first -- a shrinking bottom line vetoes the rocket outright,
  # however cheap the stock, which is what knocked out otherwise ideal
  # candidates like KMB (4 patterns), MOH (5), CHWY (5) and LI (7).
  #
  # The profile that survives is a specific one: a quality name that had its
  # own de-rating, not a broad cyclical. Of 133 existing tickers, 56% have
  # never produced a single buy pattern -- mega-cap defensives essentially
  # never do.
  #
  # What is NOT verified here is the third leg, the Morningstar discount.
  # That needs `screener scrape`; these are candidates for a strong buy, not
  # promises of one.
