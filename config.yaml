  # --- Oversold across Europe, found by scanning ------------------------
  # Discovered rather than picked: 1,872 listings across fourteen European
  # markets, filtered to primary exchanges, deduplicated, held to EUR 1m of
  # stock traded a day, and ranked by daily RSI. These were the 25 most
  # oversold that survived.
  #
  # Three filters earned their place, and each removed something the eye
  # would have accepted:
  #
  #   * LSE's 0Lxx/0Yxx codes are its international depositary board -- Trade
  #     Desk and Broadcom both showed up as "oversold UK stocks".
  #   * A company appearing in two markets is a cross-listing, and the thin
  #     line carries a stale price. SANOFI reads RSI 21 in Zurich and 59.8 in
  #     Paris, where thirteen times the volume trades. It is not oversold.
  #     Ferrovial passes the same test the other way -- Madrid has 112x the
  #     volume of its Amsterdam line -- so BME:FER is the one kept.
  #   * Turnover converted to euros before the liquidity floor. A Stockholm
  #     name at "62,807 a day" is EUR 5.6k, not EUR 62k.
  #
  # Currencies vary and the dashboard labels them: Zurich in CHF, Stockholm
  # SEK, Oslo NOK, Copenhagen DKK, and London in PENCE -- see the Rolls-Royce
  # note above for why GBX has to be explicit.
  #
  # Morningstar slugs: a scrape run on 2026-08-26 proved xpar, xetr, xswx and
  # xams (ten values recorded), and xlon was already proven by Rolls-Royce.
  # xmce/acs returned a 404 -- XMCE is Madrid's *segment* MIC and Morningstar
  # keys on the operating one, so Madrid is xmad. Still unproven, because the
  # run crashed before reaching them: xbru, xcse, xdub, xmil, xosl, xsto.
  # Paris
