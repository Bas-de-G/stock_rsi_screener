# Stock RSI screener configuration.
# Safe to commit — contains no credentials.

# Large-cap market leaders. Every entry below was checked against both
# TradingView and Yahoo before being added, so none of them 404 on a run.
# `tradingview` must carry the right exchange prefix (WMT is NASDAQ, not NYSE);
# `morningstar` is the URL slug: xnas = Nasdaq, xnys = NYSE.
tickers:
  # --- Mega-cap tech -------------------------------------------------
  - {symbol: AAPL,  tradingview: "NASDAQ:AAPL",  morningstar: xnas/aapl}
  - {symbol: MSFT,  tradingview: "NASDAQ:MSFT",  morningstar: xnas/msft}
  - {symbol: GOOGL, tradingview: "NASDAQ:GOOGL", morningstar: xnas/googl}
  - {symbol: AMZN,  tradingview: "NASDAQ:AMZN",  morningstar: xnas/amzn}
  - {symbol: NVDA,  tradingview: "NASDAQ:NVDA",  morningstar: xnas/nvda}
  - {symbol: META,  tradingview: "NASDAQ:META",  morningstar: xnas/meta}
  - {symbol: TSLA,  tradingview: "NASDAQ:TSLA",  morningstar: xnas/tsla}
  - {symbol: NFLX,  tradingview: "NASDAQ:NFLX",  morningstar: xnas/nflx}
  - {symbol: ADBE,  tradingview: "NASDAQ:ADBE",  morningstar: xnas/adbe}
  - {symbol: CRM,   tradingview: "NYSE:CRM",     morningstar: xnys/crm}
  - {symbol: ORCL,  tradingview: "NYSE:ORCL",    morningstar: xnys/orcl}
  - {symbol: IBM,   tradingview: "NYSE:IBM",     morningstar: xnys/ibm}

  # --- Semiconductors ------------------------------------------------
  - {symbol: AVGO,  tradingview: "NASDAQ:AVGO",  morningstar: xnas/avgo}
  - {symbol: AMD,   tradingview: "NASDAQ:AMD",   morningstar: xnas/amd}
  - {symbol: INTC,  tradingview: "NASDAQ:INTC",  morningstar: xnas/intc}
  - {symbol: QCOM,  tradingview: "NASDAQ:QCOM",  morningstar: xnas/qcom}
  - {symbol: TXN,   tradingview: "NASDAQ:TXN",   morningstar: xnas/txn}
  - {symbol: AMAT,  tradingview: "NASDAQ:AMAT",  morningstar: xnas/amat}
  - {symbol: CSCO,  tradingview: "NASDAQ:CSCO",  morningstar: xnas/csco}
  # Flash storage, spun back off from Western Digital as its own listing in 2025.
  - {symbol: SNDK,  tradingview: "NASDAQ:SNDK",  morningstar: xnas/sndk}

  # --- Financials ----------------------------------------------------
  - {symbol: JPM,   tradingview: "NYSE:JPM",     morningstar: xnys/jpm}
  - {symbol: V,     tradingview: "NYSE:V",       morningstar: xnys/v}
  - {symbol: MA,    tradingview: "NYSE:MA",      morningstar: xnys/ma}

  # --- Healthcare ----------------------------------------------------
  - {symbol: JNJ,   tradingview: "NYSE:JNJ",     morningstar: xnys/jnj}
  - {symbol: UNH,   tradingview: "NYSE:UNH",     morningstar: xnys/unh}
  - {symbol: LLY,   tradingview: "NYSE:LLY",     morningstar: xnys/lly}

  # --- Consumer & industrial ------------------------------------------
  - {symbol: WMT,   tradingview: "NASDAQ:WMT",   morningstar: xnas/wmt}
  - {symbol: COST,  tradingview: "NASDAQ:COST",  morningstar: xnas/cost}
  - {symbol: PEP,   tradingview: "NASDAQ:PEP",   morningstar: xnas/pep}
  - {symbol: PG,    tradingview: "NYSE:PG",      morningstar: xnys/pg}
  - {symbol: KO,    tradingview: "NYSE:KO",      morningstar: xnys/ko}
  - {symbol: HD,    tradingview: "NYSE:HD",      morningstar: xnys/hd}
  - {symbol: DIS,   tradingview: "NYSE:DIS",     morningstar: xnys/dis}

  # --- Energy ---------------------------------------------------------
  - {symbol: XOM,   tradingview: "NYSE:XOM",     morningstar: xnys/xom}
  - {symbol: CVX,   tradingview: "NYSE:CVX",     morningstar: xnys/cvx}

  # --- UK listing ------------------------------------------------------
  # Rolls-Royce Holdings (the aero-engine maker; Rolls-Royce Motor Cars is
  # owned by BMW and isn't listed). Every identifier differs here, which is
  # what `yahoo` and `currency` exist for:
  #   TradingView  LSE:RR.   (trailing dot)
  #   Yahoo        RR.L
  #   Morningstar  xlon/rr.
  # Quoted in pence, not pounds -- 1413.6 means GBX 1413.6 (about GBP 14.14).
  - {symbol: RR, tradingview: "LSE:RR.", morningstar: xlon/rr., yahoo: RR.L, currency: GBX}

rsi:
  # Wilder RSI, the same definition TradingView's "RSI (14)" uses.
  # TradingView only publishes periods 14 and 7.
  period: 14
  threshold: 30
  interval: "1D"

signal:
  # Two upward crossings of the RSI threshold must occur within this window.
  window_days: 14
  # calendar = 14 actual days; trading = 14 rows of stored RSI history.
  window_unit: calendar

  # Which side of fair value allows a signal to fire.
  #
  #   price_below_fair_value  -> fires when price < fair value  (trading BELOW fair value)
  #   fair_value_below_price  -> fires when fair value < price  (trading ABOVE fair value)
  #
  # Set to the "buy it while it's cheap" reading.
  valuation_rule: price_below_fair_value

  # true  -> a completed RSI pattern is a buy signal on its own. Recording a
  #          fair value that agrees upgrades it to a STRONG BUY (rocket on the
  #          dashboard); one that disagrees leaves it a plain buy signal,
  #          flagged as trading above fair value.
  # false -> strict mode: nothing fires until a fair value confirms it.
  fire_without_valuation: true

storage:
  database: data/screener.db
  csv_dir: data
  # Hand-checked Morningstar fair values. Committed and editable on GitHub,
  # unlike the database — see the README.
  fair_values: fair_values.yaml

dashboard:
  # Where `screener dashboard` writes the page.
  output: data/dashboard.html
  # Trading days of RSI history to plot per stock.
  chart_days: 90

morningstar:
  # The automated scraper: `python -m screener.cli scrape`. Until you set it
  # up, use the "Check fair value" button on the dashboard and record what you
  # see with:  python -m screener.cli fair-value NVDA 225
  state_file: auth/morningstar_state.json
  page_timeout: 45
  debug_on_failure: true
  # Leave false. A headless scrape has been observed to trip Morningstar's AWS
  # WAF bot-protection (a CAPTCHA challenge page, not a login failure) on the
  # subscriber-only quote page, while the interactive `login` flow's visible
  # browser gets through fine. Setting this true trades that risk for a
  # scrape that doesn't pop a window — probably not worth it.
  headless: false
