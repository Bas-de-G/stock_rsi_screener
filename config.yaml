# Each RSI timeframe, and the three things that scale with holding period.
# The interval codes themselves aren't configurable -- they're what TradingView
# and Yahoo actually accept -- but these three are:
#
#   window_days  how far apart the two upward crosses of 30 may be. Has to be
#                per-horizon: a flat 14 days is only two weekly bars, so a 1w
#                pattern could never form at all.
#   margin       how far below fair value the price must sit before the
#                valuation gate confirms. Longer hold, more headroom demanded.
#   leverage     the multiplier the dashboard suggests for this timeframe.
#                A fixed number attached to the horizon, not a calculation --
#                and 10x on an hourly signal is a genuinely aggressive setting.
#
# Delete any key to fall back to the built-in default shown here.
horizons:
  "1h": {window_days: 2,  margin: 0.10, leverage: 10}
  "4h": {window_days: 5,  margin: 0.20, leverage: 5}
  "1d": {window_days: 14, margin: 0.30, leverage: 2}
  "1w": {window_days: 90, margin: 0.50, leverage: 1}

rsi:
  # Wilder RSI, the same definition TradingView's "RSI (14)" uses.
  # TradingView only publishes periods 14 and 7.
  period: 14
  threshold: 30
  interval: "1D"

signal:
  # Two upward crossings of the RSI threshold must occur within this window.
  window_days: 14
  # calendar = 14 actual days; trading = 14 rows of stored RSI history.
  window_unit: calendar

  # Which side of fair value allows a signal to fire.
  #
  #   price_below_fair_value  -> fires when price < fair value  (trading BELOW fair value)
  #   fair_value_below_price  -> fires when fair value < price  (trading ABOVE fair value)
  #
  # Set to the "buy it while it's cheap" reading.
  valuation_rule: price_below_fair_value

  # true  -> a completed RSI pattern is a buy signal on its own. Recording a
  #          fair value that agrees upgrades it to a STRONG BUY (rocket on the
  #          dashboard); one that disagrees leaves it a plain buy signal,
  #          flagged as trading above fair value.
  # false -> strict mode: nothing fires until a fair value confirms it.
  fire_without_valuation: true

storage:
  database: data/screener.db
  csv_dir: data
  # Hand-checked Morningstar fair values. Committed and editable on GitHub,
  # unlike the database — see the README.
  fair_values: fair_values.yaml
  # Which strong buys have already been emailed. Committed on every run, so a
  # signal announced at 14:00 is still known to be announced at 14:30.
  notifications: notifications.json
  # Append-only record of every verdict published, as it stood at the time.
  # The sample "is any of this working?" gets answered from — see
  # screener/journal.py for why it cannot live in the database.
  recommendations: recommendations.csv

dashboard:
  # Used only to link back from a webhook notification.
  site_url: https://bas-de-g.github.io/stock_rsi_screener
  # Where `screener dashboard` writes the page.
  output: data/dashboard.html
  # Trading days of RSI history to plot per stock.
  chart_days: 90

notify:
  # Which timeframes are allowed to ring a phone.
  #
  # This governs the ntfy push ONLY. Every timeframe still appears on the
  # dashboard, still gets journalled, and still opens a GitHub issue — so
  # nothing is lost, it just waits to be read instead of interrupting.
  #
  # The hourly chart is where the volume is: 55 of the 75 alerts ever sent came
  # from it. An hourly signal also stays fresh for only about six hours, so by
  # the time a phone is picked up it is often already stale. The slower charts
  # are the ones worth being interrupted for.
  #
  # Set to [] to stop phone alerts entirely and keep the emails.
  push_horizons: [4h, 1d]

scoring:
  # How much each factor counts towards the 1–10 conviction score on each card.
  #
  # Edit these and every score moves; the weights in force are written into
  # each row of recommendations.csv, so a re-weighting shows up in the measured
  # results rather than quietly rewriting the past.
  #
  # The score DECIDES NOTHING today. The rocket and the phone alert still come
  # from the older rule (fair value required, everything else a veto), because
  # that rule has a track record on the Historical Dashboard and this has none
  # until it has run forward for a few months. See screener/scoring.py.
  #
  # Setting a weight to 0 removes the factor from the score entirely.
  weights:
    valuation: 3.0   # discount to Morningstar's fair value — the thesis
    ruleone:   2.0   # the Buffett score, itself already a 1–10
    growth:    1.5   # year-on-year EPS growth
    earnings:  1.0   # clear of results, or too close to them
    pattern:   1.0   # how deep the RSI dip went below the line

morningstar:
  # The automated scraper: `python -m screener.cli scrape`. Until you set it
  # up, use the "Check fair value" button on the dashboard and record what you
  # see with:  python -m screener.cli fair-value NVDA 225
  state_file: auth/morningstar_state.json
  page_timeout: 45
  debug_on_failure: true
  # Leave false. A headless scrape has been observed to trip Morningstar's AWS
  # WAF bot-protection (a CAPTCHA challenge page, not a login failure) on the
  # subscriber-only quote page, while the interactive `login` flow's visible
  # browser gets through fine. Setting this true trades that risk for a
  # scrape that doesn't pop a window — probably not worth it.
  headless: false
