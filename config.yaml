# Each RSI timeframe, and the three things that scale with holding period.
# The interval codes themselves aren't configurable -- they're what TradingView
# and Yahoo actually accept -- but these three are:
#
#   window_days  how far apart the two upward crosses of 30 may be. Has to be
#                per-horizon: a flat 14 days is only two weekly bars, so a 1w
#                pattern could never form at all.
#   margin       how far below fair value the price must sit before the
#                valuation gate confirms. Longer hold, more headroom demanded.
#   leverage     the multiplier the dashboard suggests for this timeframe.
#                A fixed number attached to the horizon, not a calculation --
#                and 10x on an hourly signal is a genuinely aggressive setting.
#
# Delete any key to fall back to the built-in default shown here.
horizons:
  "1h": {window_days: 2,  margin: 0.05, leverage: 10}
  "4h": {window_days: 5,  margin: 0.10, leverage: 5}
  "1d": {window_days: 14, margin: 0.15, leverage: 2}
  "1w": {window_days: 90, margin: 0.25, leverage: 1}

rsi:
  # Wilder RSI, the same definition TradingView's "RSI (14)" uses.
  # TradingView only publishes periods 14 and 7.
  period: 14
  threshold: 30
  interval: "1D"

signal:
  # Two upward crossings of the RSI threshold must occur within this window.
  window_days: 14
  # calendar = 14 actual days; trading = 14 rows of stored RSI history.
  window_unit: calendar

  # Which side of fair value allows a signal to fire.
  #
  #   price_below_fair_value  -> fires when price < fair value  (trading BELOW fair value)
  #   fair_value_below_price  -> fires when fair value < price  (trading ABOVE fair value)
  #
  # Set to the "buy it while it's cheap" reading.
  valuation_rule: price_below_fair_value

  # true  -> a completed RSI pattern is a buy signal on its own. Recording a
  #          fair value that agrees upgrades it to a STRONG BUY (rocket on the
  #          dashboard); one that disagrees leaves it a plain buy signal,
  #          flagged as trading above fair value.
  # false -> strict mode: nothing fires until a fair value confirms it.
  fire_without_valuation: true

storage:
  database: data/screener.db
  csv_dir: data
  # Hand-checked Morningstar fair values. Committed and editable on GitHub,
  # unlike the database — see the README.
  fair_values: fair_values.yaml

dashboard:
  # Where `screener dashboard` writes the page.
  output: data/dashboard.html
  # Trading days of RSI history to plot per stock.
  chart_days: 90

morningstar:
  # The automated scraper: `python -m screener.cli scrape`. Until you set it
  # up, use the "Check fair value" button on the dashboard and record what you
  # see with:  python -m screener.cli fair-value NVDA 225
  state_file: auth/morningstar_state.json
  page_timeout: 45
  debug_on_failure: true
  # Leave false. A headless scrape has been observed to trip Morningstar's AWS
  # WAF bot-protection (a CAPTCHA challenge page, not a login failure) on the
  # subscriber-only quote page, while the interactive `login` flow's visible
