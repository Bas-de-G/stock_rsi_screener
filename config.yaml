  #   TradingView  LSE:RR.   (trailing dot)
  #   Yahoo        RR.L
  #   Morningstar  xlon/rr.
  # Quoted in pence, not pounds -- 1413.6 means GBX 1413.6 (about GBP 14.14).
  - {symbol: RR, tradingview: "LSE:RR.", morningstar: xlon/rr., yahoo: RR.L, currency: GBX, markets: [europe]}

  # --- Dutch listings (Euronext Amsterdam) ------------------------------
  # AEX heavyweights. Three identifier quirks apply to every one of these:
  #   TradingView  EURONEXT:<ticker>   (one prefix for all of Euronext, not a
  #                                     per-city code -- AMS: and XAMS: 404)
  #   Yahoo        <ticker>.AS
  #   Morningstar  xams/<ticker>       (XAMS is the MIC for Euronext Amsterdam,
  #                                     same convention as xnas/xnys/xlon above)
  # All quoted in euros, so `currency: EUR` shows next to the price.
  #
  # Amsterdam closes 17:30 CET, hours before the 21:30 UTC scheduled run, so
  # these are always settled daily bars -- never a mid-session RSI.

  # Semiconductors -- the cluster the AEX is genuinely world-class at.
